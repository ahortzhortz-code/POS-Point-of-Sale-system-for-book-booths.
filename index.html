<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิดเงิน - บูธหนังสือ (Pixel Art Pastel)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts: Kanit (สำหรับภาษาไทย) และ Press Start 2P (สำหรับตัวเลขและอังกฤษแนว Pixel) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --pastel-purple: #CDB4DB; /* ม่วง */
            --pastel-yellow: #FDFD96; /* เหลือง */
            --pastel-blue: #A2D2FF;   /* ฟ้า */
            --pastel-pink: #FFC8DD;   /* ชมพู (เผื่อใช้แซม) */
            --pixel-black: #1a1a1a;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fdfaf6;
            /* พื้นหลังลายตารางแนวน่ารักๆ */
            background-image: 
                linear-gradient(var(--pastel-blue) 1px, transparent 1px),
                linear-gradient(90deg, var(--pastel-blue) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
            color: var(--pixel-black);
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* กล่องสไตล์ Pixel (ขอบหนา เงาทึบ) */
        .pixel-box {
            background-color: white;
            border: 4px solid var(--pixel-black);
            box-shadow: 6px 6px 0px 0px var(--pixel-black);
            border-radius: 0;
        }

        /* ปุ่มสไตล์ Pixel */
        .pixel-btn {
            border: 3px solid var(--pixel-black);
            box-shadow: 4px 4px 0px 0px var(--pixel-black);
            transition: all 0.1s ease-in-out;
            cursor: pointer;
            border-radius: 0;
            font-weight: bold;
        }

        .pixel-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px var(--pixel-black);
        }
        
        .pixel-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 4px 4px 0px 0px var(--pixel-black) !important;
        }

        /* ช่อง Input (Input Fields) */
        .pixel-input {
            border: 3px solid var(--pixel-black);
            background-color: white;
            border-radius: 0;
            outline: none;
        }
        .pixel-input:focus {
            background-color: #fffae6;
        }

        /* แท็บที่ซ่อนไว้ */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ซ่อนลูกศรใน input type="number" */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }

        /* ปรับแต่ง Scrollbar ให้ดู Blocky */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: white; border-left: 2px solid var(--pixel-black); }
        ::-webkit-scrollbar-thumb { background: var(--pastel-purple); border: 2px solid var(--pixel-black); }
        ::-webkit-scrollbar-thumb:hover { background: var(--pastel-blue); }

        /* ตารางสไตล์ Pixel */
        table { border-collapse: separate; border-spacing: 0; }
        th, td { border-bottom: 2px solid var(--pixel-black); }
        th { background-color: var(--pastel-purple); border-top: 2px solid var(--pixel-black); border-bottom: 4px solid var(--pixel-black); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-[#CDB4DB] border-b-4 border-black p-4 flex justify-between items-center z-10" style="box-shadow: 0 4px 0 0 #1a1a1a;">
        <div class="flex items-center group cursor-pointer bg-white px-3 py-1 border-2 border-black pixel-box shadow-none" onclick="openBoothNameModal()" title="คลิกเพื่อเปลี่ยนชื่อบูธ">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fas fa-store mr-2 text-[#A2D2FF]" style="text-shadow: 1px 1px 0 #000;"></i> 
                <span id="display-booth-name">POS บูธหนังสือ</span>
                <i class="fas fa-pencil-alt ml-2 text-gray-400 group-hover:text-black transition-colors text-sm"></i>
            </h1>
        </div>
        <div class="flex space-x-3">
            <button onclick="switchTab('checkout')" id="btn-checkout" class="pixel-btn px-4 py-2 bg-[#A2D2FF] text-black active-tab">
                <i class="fas fa-cash-register mr-1"></i> คิดเงิน
            </button>
            <button onclick="switchTab('inventory')" id="btn-inventory" class="pixel-btn px-4 py-2 bg-[#FDFD96] text-black">
                <i class="fas fa-boxes mr-1"></i> สินค้า
            </button>
        </div>
    </header>

    <main class="flex-grow overflow-hidden flex flex-col p-4">

        <!-- แท็บคิดเงิน (Checkout) -->
        <div id="tab-checkout" class="tab-content active h-full flex flex-col md:flex-row gap-6">
            
            <!-- ด้านซ้าย: รายการสินค้าที่เลือก (Cart) -->
            <div class="w-full md:w-2/3 flex flex-col gap-4">
                
                <!-- ช่องสแกนบาร์โค้ด (ย้ายมาไว้ด้านบนให้เด่น) -->
                <div class="pixel-box p-4 bg-[#FDFD96] flex items-center gap-3">
                    <i class="fas fa-barcode text-2xl drop-shadow-[2px_2px_0_rgba(0,0,0,0.2)]"></i>
                    <form id="barcode-form" class="flex-grow flex gap-2" onsubmit="handleBarcodeSubmit(event)">
                        <input type="text" id="barcode-input" placeholder="สแกน หรือ พิมพ์รหัส..." 
                            class="w-full px-4 py-2 text-lg pixel-input font-bold" autofocus autocomplete="off">
                        <button type="submit" class="pixel-btn bg-[#CDB4DB] px-6 py-2">เพิ่ม</button>
                    </form>
                </div>

                <!-- ตารางตะกร้าสินค้า -->
                <div class="pixel-box flex-grow flex flex-col bg-white overflow-hidden">
                    <div class="p-3 border-b-4 border-black bg-[#A2D2FF] flex justify-between items-center">
                        <h2 class="text-lg font-bold">🛒 รายการสั่งซื้อ</h2>
                        <button onclick="clearCart()" class="pixel-btn bg-[#FFC8DD] px-3 py-1 text-sm">
                            <i class="fas fa-trash-alt mr-1"></i> ล้าง
                        </button>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto p-4 bg-white">
                        <table class="w-full text-left">
                            <thead>
                                <tr>
                                    <th class="p-2 font-bold w-1/2">สินค้า</th>
                                    <th class="p-2 font-bold text-center w-1/6">ราคา</th>
                                    <th class="p-2 font-bold text-center w-1/6">จำนวน</th>
                                    <th class="p-2 font-bold text-right w-1/6">รวม</th>
                                    <th class="p-2 w-8 border-b-4 border-black bg-[#CDB4DB]"></th>
                                </tr>
                            </thead>
                            <tbody id="cart-items" class="font-semibold">
                                <!-- รายการสินค้าจะถูกเพิ่มที่นี่ด้วย JavaScript -->
                                <tr><td colspan="5" class="py-8 text-center text-gray-400">ยังไม่มีสินค้าในตะกร้า</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ด้านขวา: ส่วนชำระเงิน -->
            <div class="w-full md:w-1/3 flex flex-col gap-6">
                
                <!-- กล่องสรุปยอดเงิน (ยอดรวม) -->
                <div class="pixel-box bg-[#CDB4DB] p-6 text-center flex flex-col justify-center">
                    <h3 class="font-bold text-black mb-2 text-lg">ยอดรวมทั้งหมด (฿)</h3>
                    <div id="cart-total" class="text-4xl font-bold pixel-font text-white drop-shadow-[3px_3px_0_#000] tracking-wider">0.00</div>
                </div>

                <!-- กล่องคำนวณเงินทอน -->
                <div class="pixel-box bg-white p-5 flex-grow flex flex-col">
                    <h3 class="text-lg font-bold border-b-2 border-black pb-2 mb-4 bg-[#FDFD96] px-2 -mx-5 -mt-5 pt-4 border-t-0 shadow-[0_4px_0_0_#000] mb-6">💰 รับชำระเงิน</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-bold mb-1">รับเงินมา (฿)</label>
                        <input type="number" id="cash-received" placeholder="0" oninput="calculateChange()"
                            class="w-full px-4 py-3 text-2xl text-right font-bold pixel-input bg-[#A2D2FF] placeholder-gray-600">
                    </div>
                    
                    <div class="flex justify-between items-center mb-6 bg-gray-100 p-3 border-2 border-black border-dashed">
                        <span class="font-bold text-lg">เงินทอน:</span>
                        <span id="change-amount" class="text-2xl font-bold pixel-font text-red-500 drop-shadow-[1px_1px_0_#000]">0.00</span>
                    </div>

                    <!-- ปุ่มชำระเงินด่วน -->
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <button onclick="addCash(20)" class="pixel-btn bg-white py-2 text-green-700 hover:bg-[#FDFD96]">+20</button>
                        <button onclick="addCash(50)" class="pixel-btn bg-white py-2 text-green-700 hover:bg-[#FDFD96]">+50</button>
                        <button onclick="addCash(100)" class="pixel-btn bg-white py-2 text-green-700 hover:bg-[#FDFD96]">+100</button>
                        <button onclick="addCash(500)" class="pixel-btn bg-white py-2 text-green-700 hover:bg-[#FDFD96]">+500</button>
                        <button onclick="addCash(1000)" class="pixel-btn bg-white py-2 text-green-700 hover:bg-[#FDFD96]">+1000</button>
                        <button onclick="exactCash()" class="pixel-btn bg-[#CDB4DB] py-2 text-black">พอดี</button>
                    </div>

                    <button onclick="completeTransaction()" class="pixel-btn w-full py-4 mt-auto bg-[#A2D2FF] text-xl flex justify-center items-center hover:bg-[#8ec3f8]">
                        <i class="fas fa-check-square mr-2"></i> คิดเงินเลย!
                    </button>
                </div>
            </div>
            
            <!-- แผงปุ่มสินค้าลัด -->
            <div id="quick-items-panel" class="absolute bottom-0 left-0 w-full md:w-2/3 h-56 pixel-box bg-white p-4 flex flex-col z-20 transition-transform duration-300 transform translate-y-full border-b-0 border-l-0">
                <div class="flex justify-between items-center mb-3 border-b-2 border-black pb-2">
                    <h3 class="font-bold bg-[#FDFD96] px-2 py-1 border-2 border-black">📦 แตะเพื่อเพิ่มสินค้า</h3>
                    <button onclick="toggleQuickPanel()" class="pixel-btn bg-[#FFC8DD] px-3 py-1">
                        <i class="fas fa-times"></i> ปิด
                    </button>
                </div>
                <div id="quick-items-container" class="flex-grow overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-1">
                    <!-- ปุ่มสินค้าด่วนจะแสดงที่นี่ -->
                </div>
            </div>
            <!-- ปุ่มเปิดแผงสินค้าด่วน -->
            <button onclick="toggleQuickPanel()" class="absolute bottom-6 left-6 pixel-btn bg-[#FDFD96] p-4 z-10 flex items-center gap-2 hover:bg-[#fff970]">
                <i class="fas fa-gamepad text-xl"></i> <span class="hidden sm:inline font-bold">เมนูสินค้า</span>
            </button>
        </div>

        <!-- แท็บจัดการสินค้า (Inventory) -->
        <div id="tab-inventory" class="tab-content h-full overflow-y-auto pb-8">
            <div class="max-w-4xl mx-auto pixel-box p-6 bg-white">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <h2 class="text-2xl font-bold bg-[#A2D2FF] px-4 py-2 border-2 border-black inline-block shadow-[4px_4px_0_0_#000]">
                        <i class="fas fa-database mr-2"></i> ฐานข้อมูลสินค้า
                    </h2>
                    <button onclick="openProductModal()" class="pixel-btn bg-[#CDB4DB] px-4 py-2 flex items-center">
                        <i class="fas fa-plus-square mr-2"></i> เพิ่มไอเทมใหม่
                    </button>
                </div>

                <div class="overflow-x-auto border-4 border-black">
                    <table class="w-full text-left bg-white">
                        <thead>
                            <tr>
                                <th class="p-3">รหัส/บาร์โค้ด</th>
                                <th class="p-3">ชื่อสินค้า</th>
                                <th class="p-3 text-right">ราคา (฿)</th>
                                <th class="p-3 text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list" class="font-semibold">
                            <!-- รายการสินค้าจะแสดงที่นี่ -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal เพิ่ม/แก้ไข สินค้า -->
    <div id="product-modal" class="fixed inset-0 bg-[#CDB4DB] bg-opacity-80 flex items-center justify-center hidden z-50 backdrop-blur-sm p-4">
        <div class="pixel-box bg-white w-full max-w-md p-0 flex flex-col">
            <div class="bg-[#FDFD96] border-b-4 border-black px-4 py-3 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-lg">เพิ่มไอเทมใหม่</h3>
                <button onclick="closeProductModal()" class="pixel-btn bg-[#FFC8DD] px-2 py-1">X</button>
            </div>
            
            <form id="product-form" class="p-5 bg-white" onsubmit="saveProduct(event)">
                <input type="hidden" id="edit-index" value="-1">
                
                <div class="mb-4">
                    <label class="block font-bold mb-2">รหัสสินค้า / บาร์โค้ด *</label>
                    <div class="flex gap-2">
                        <input type="text" id="prod-barcode" required class="flex-grow pixel-input p-2 font-mono" placeholder="ยิงสแกนเลย...">
                        <button type="button" onclick="generateRandomBarcode()" class="pixel-btn bg-[#A2D2FF] px-3 text-sm">สุ่มรหัส</button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block font-bold mb-2">ชื่อสินค้า *</label>
                    <input type="text" id="prod-name" required class="w-full pixel-input p-2" placeholder="เช่น โพสอิท ลายแมว">
                </div>
                
                <div class="mb-6">
                    <label class="block font-bold mb-2">ราคา (฿) *</label>
                    <input type="number" id="prod-price" required min="0" step="0.25" class="w-full pixel-input p-2 font-mono" placeholder="0.00">
                </div>
                
                <div class="flex items-center justify-end gap-3 pt-4 border-t-2 border-dashed border-gray-300">
                    <button type="button" onclick="closeProductModal()" class="pixel-btn bg-gray-200 px-4 py-2">ยกเลิก</button>
                    <button type="submit" class="pixel-btn bg-[#A2D2FF] px-6 py-2">บันทึก (SAVE)</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal เปลี่ยนชื่อบูธ -->
    <div id="booth-name-modal" class="fixed inset-0 bg-[#A2D2FF] bg-opacity-80 flex items-center justify-center hidden z-50 backdrop-blur-sm p-4">
        <div class="pixel-box bg-white w-full max-w-sm">
            <div class="bg-[#CDB4DB] border-b-4 border-black px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-lg">ตั้งชื่อบูธ</h3>
                <button onclick="closeBoothNameModal()" class="pixel-btn bg-white px-2 py-1">X</button>
            </div>
            <form class="p-5" onsubmit="saveBoothName(event)">
                <div class="mb-6">
                    <label class="block font-bold mb-2">ชื่อร้าน/บูธ ของคุณ</label>
                    <input type="text" id="input-booth-name" required class="w-full pixel-input p-2 font-bold text-center text-lg" placeholder="ใส่ชื่อบูธ...">
                </div>
                <div class="flex items-center justify-center gap-3">
                    <button type="button" onclick="closeBoothNameModal()" class="pixel-btn bg-gray-200 px-4 py-2">ยกเลิก</button>
                    <button type="submit" class="pixel-btn bg-[#FDFD96] px-6 py-2">ตกลง (OK)</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Confirm Modal (แทนที่ confirm() พื้นฐาน) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-[60] p-4">
        <div class="pixel-box bg-white p-6 max-w-sm w-full text-center">
            <i class="fas fa-exclamation-triangle text-4xl text-[#FDFD96] drop-shadow-[2px_2px_0_#000] mb-4"></i>
            <h3 class="font-bold text-xl mb-6" id="confirm-message">แน่ใจหรือไม่?</h3>
            <div class="flex gap-4 justify-center">
                <button onclick="closeConfirmModal()" class="pixel-btn bg-gray-200 px-4 py-2 w-1/2">ยกเลิก</button>
                <button id="btn-confirm-yes" class="pixel-btn bg-[#FFC8DD] px-4 py-2 w-1/2">ลบเลย</button>
            </div>
        </div>
    </div>

    <!-- Custom Success Modal (แทนที่ alert() พื้นฐาน) -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-[60] p-4">
        <div class="pixel-box bg-white p-0 max-w-sm w-full text-center border-4 border-black overflow-hidden">
            <div class="bg-[#FDFD96] p-4 border-b-4 border-black">
                <h3 class="pixel-font text-xl text-black">LEVEL UP!</h3>
            </div>
            <div class="p-6 bg-white">
                <p class="font-bold text-lg mb-2 text-green-600">ทำรายการสำเร็จ!</p>
                <div id="success-details" class="mb-6 font-semibold text-gray-700 bg-gray-100 p-3 border-2 border-dashed border-gray-400 text-left space-y-1">
                </div>
                <button onclick="closeSuccessModal()" class="pixel-btn bg-[#A2D2FF] px-6 py-3 w-full text-lg">CONTINUE <i class="fas fa-play ml-1 text-xs"></i></button>
            </div>
        </div>
    </div>

    <!-- แจ้งเตือนแบบ Toast สไตล์ Pixel -->
    <div id="toast" class="fixed top-4 right-4 pixel-box bg-[#CDB4DB] text-black px-6 py-3 transition-opacity duration-300 opacity-0 pointer-events-none z-[100]">
        <span id="toast-message" class="font-bold"><i class="fas fa-info-circle mr-2"></i> ข้อความ</span>
    </div>

    <script>
        // --- ข้อมูลเบื้องต้น ---
        let boothName = 'POS บูธหนังสือ';
        let products = [
            { barcode: '1001', name: 'หนังสือ นิทานทำมือ', price: 150 },
            { barcode: '1002', name: 'สมุดบันทึก ปกหนัง', price: 89 },
            { barcode: '1003', name: 'โปสการ์ด ภาพวาดสีน้ำ', price: 20 },
            { barcode: '1004', name: 'สติ๊กเกอร์ไดคัท ลายแมว', price: 35 },
            { barcode: '885000000001', name: 'กระเป๋าผ้าสกรีนลาย', price: 199 }
        ];
        let cart = [];

        window.onload = function() {
            const savedBoothName = localStorage.getItem('pos_booth_name');
            if (savedBoothName) {
                boothName = savedBoothName;
                document.getElementById('display-booth-name').textContent = boothName;
            }
            const savedProducts = localStorage.getItem('pos_products');
            if (savedProducts) {
                products = JSON.parse(savedProducts);
            }
            renderInventory();
            renderQuickItems();
            updateCartDisplay();
            document.getElementById('barcode-input').focus();
        };

        function saveProductsToStorage() {
            localStorage.setItem('pos_products', JSON.stringify(products));
        }

        // --- ระบบ UI ควบคุม ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // รีเซ็ตปุ่ม
            document.getElementById('btn-checkout').className = 'pixel-btn px-4 py-2 bg-white text-black';
            document.getElementById('btn-inventory').className = 'pixel-btn px-4 py-2 bg-white text-black';
            
            // ไฮไลต์ปุ่มที่เลือก (ใช้สี Pastel ที่ต่างกัน)
            if(tabName === 'checkout') {
                document.getElementById('btn-checkout').className = 'pixel-btn px-4 py-2 bg-[#A2D2FF] text-black active-tab shadow-none translate-x-[2px] translate-y-[2px]';
                setTimeout(() => document.getElementById('barcode-input').focus(), 100);
            } else {
                document.getElementById('btn-inventory').className = 'pixel-btn px-4 py-2 bg-[#FDFD96] text-black active-tab shadow-none translate-x-[2px] translate-y-[2px]';
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<span class="font-bold"><i class="fas ${type === 'error' ? 'fa-times-circle text-red-500' : 'fa-check-circle text-green-600'} mr-2"></i> ${message}</span>`;
            
            toast.style.backgroundColor = type === 'error' ? '#FFC8DD' : '#CDB4DB';

            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // --- ระบบตั้งชื่อบูธ ---
        function openBoothNameModal() {
            document.getElementById('input-booth-name').value = boothName;
            document.getElementById('booth-name-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-booth-name').focus(), 100);
        }
        function closeBoothNameModal() {
            document.getElementById('booth-name-modal').classList.add('hidden');
            if (document.getElementById('tab-checkout').classList.contains('active')) {
                document.getElementById('barcode-input').focus();
            }
        }
        function saveBoothName(e) {
            e.preventDefault();
            const newName = document.getElementById('input-booth-name').value.trim();
            if (newName) {
                boothName = newName;
                document.getElementById('display-booth-name').textContent = boothName;
                localStorage.setItem('pos_booth_name', boothName);
                closeBoothNameModal();
                showToast('เปลี่ยนชื่อร้านแล้ว!');
            }
        }

        // --- ระบบตะกร้า (Checkout) ---
        function handleBarcodeSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('barcode-input');
            const barcode = input.value.trim();
            if (barcode === '') return;
            addItemToCart(barcode);
            input.value = '';
            input.focus();
        }

        function addItemToCart(barcode) {
            const product = products.find(p => p.barcode === barcode);
            if (product) {
                const existingItemIndex = cart.findIndex(item => item.barcode === barcode);
                if (existingItemIndex >= 0) {
                    cart[existingItemIndex].qty += 1;
                } else {
                    cart.push({ ...product, qty: 1 });
                }
                updateCartDisplay();
                showToast(`+ ${product.name}`);
            } else {
                showToast(`ไม่พบรหัส: ${barcode}`, 'error');
                playErrorSound();
            }
        }

        function updateCartItemQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty < 1) cart.splice(index, 1);
            updateCartDisplay();
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function clearCart() {
            cart = [];
            document.getElementById('cash-received').value = '';
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const tbody = document.getElementById('cart-items');
            tbody.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-12 text-center text-gray-400 font-bold bg-gray-50 border-b-0">ว่างเปล่า...</td></tr>';
            } else {
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.qty;
                    total += itemTotal;
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-[#FDFD96] transition-colors';
                    tr.innerHTML = `
                        <td class="p-2 border-r-2 border-black border-dashed">
                            <div class="font-bold truncate w-40 sm:w-auto">${item.name}</div>
                            <div class="text-[10px] text-gray-500 font-mono">${item.barcode}</div>
                        </td>
                        <td class="p-2 text-center border-r-2 border-black border-dashed font-mono">${item.price.toFixed(2)}</td>
                        <td class="p-2 text-center border-r-2 border-black border-dashed">
                            <div class="flex items-center justify-center gap-1">
                                <button onclick="updateCartItemQty(${index}, -1)" class="w-6 h-6 bg-white border-2 border-black rounded flex items-center justify-center hover:bg-[#FFC8DD] active:scale-95 font-bold">-</button>
                                <span class="w-6 text-center font-bold">${item.qty}</span>
                                <button onclick="updateCartItemQty(${index}, 1)" class="w-6 h-6 bg-white border-2 border-black rounded flex items-center justify-center hover:bg-[#A2D2FF] active:scale-95 font-bold">+</button>
                            </div>
                        </td>
                        <td class="p-2 text-right font-mono font-bold">${itemTotal.toFixed(2)}</td>
                        <td class="p-2 text-center bg-gray-50 border-l-2 border-black border-solid">
                            <button onclick="removeCartItem(${index})" class="text-red-500 hover:text-red-700 hover:scale-110 transition-transform">
                                <i class="fas fa-times-circle text-lg drop-shadow-[1px_1px_0_#000]"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            document.getElementById('cart-total').textContent = total.toFixed(2);
            calculateChange();
            document.getElementById('barcode-input').focus();
        }

        // --- การเงิน ---
        function calculateChange() {
            const total = parseFloat(document.getElementById('cart-total').textContent) || 0;
            const cash = parseFloat(document.getElementById('cash-received').value) || 0;
            const changeDisplay = document.getElementById('change-amount');
            
            if (cash >= total && total > 0) {
                const change = cash - total;
                changeDisplay.textContent = change.toFixed(2);
                changeDisplay.classList.add('text-red-500');
            } else {
                changeDisplay.textContent = '0.00';
            }
        }

        function addCash(amount) {
            const input = document.getElementById('cash-received');
            input.value = (parseFloat(input.value) || 0) + amount;
            calculateChange();
        }

        function exactCash() {
            document.getElementById('cash-received').value = document.getElementById('cart-total').textContent;
            calculateChange();
        }

        function completeTransaction() {
            const total = parseFloat(document.getElementById('cart-total').textContent) || 0;
            const cash = parseFloat(document.getElementById('cash-received').value) || 0;

            if (cart.length === 0) {
                showToast('ยังไม่มีสินค้า', 'error');
                return;
            }
            if (cash < total) {
                showToast('รับเงินมาไม่ครบ!', 'error');
                playErrorSound();
                return;
            }

            const change = cash - total;
            
            // แสดงหน้าต่าง Success
            document.getElementById('success-details').innerHTML = `
                <div class="flex justify-between"><span>ยอดรวม:</span> <span>฿${total.toFixed(2)}</span></div>
                <div class="flex justify-between"><span>รับเงิน:</span> <span>฿${cash.toFixed(2)}</span></div>
                <div class="flex justify-between font-bold text-red-600 mt-2 border-t border-dashed border-gray-400 pt-2"><span>เงินทอน:</span> <span>฿${change.toFixed(2)}</span></div>
            `;
            document.getElementById('success-modal').classList.remove('hidden');
            
            clearCart();
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.add('hidden');
            document.getElementById('barcode-input').focus();
        }

        // --- สินค้าด่วน ---
        let quickPanelOpen = false;
        function toggleQuickPanel() {
            const panel = document.getElementById('quick-items-panel');
            quickPanelOpen = !quickPanelOpen;
            if (quickPanelOpen) {
                panel.classList.remove('translate-y-full');
            } else {
                panel.classList.add('translate-y-full');
                document.getElementById('barcode-input').focus();
            }
        }

        function renderQuickItems() {
            const container = document.getElementById('quick-items-container');
            container.innerHTML = '';
            
            // สี Pastel สลับกันสำหรับปุ่มสินค้า
            const colors = ['bg-[#CDB4DB]', 'bg-[#FDFD96]', 'bg-[#A2D2FF]', 'bg-[#FFC8DD]'];
            
            products.forEach((p, i) => {
                const btn = document.createElement('button');
                const colorClass = colors[i % colors.length];
                
                btn.className = `pixel-btn ${colorClass} p-2 flex flex-col justify-between text-left h-24`;
                btn.onclick = () => addItemToCart(p.barcode);
                
                btn.innerHTML = `
                    <div class="flex items-start justify-between w-full">
                        <i class="fas fa-box text-white drop-shadow-[1px_1px_0_#000]"></i>
                        <span class="font-bold font-mono text-sm bg-white px-1 border border-black">฿${p.price}</span>
                    </div>
                    <div class="text-sm font-bold leading-tight mt-1 line-clamp-2 w-full">
                        ${p.name}
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        // --- ฐานข้อมูลสินค้า ---
        function renderInventory() {
            const tbody = document.getElementById('inventory-list');
            tbody.innerHTML = '';
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-500 font-bold bg-gray-50">ไม่มีสินค้า เริ่มเพิ่มเลย!</td></tr>';
                return;
            }
            
            products.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#FDFD96]/40 transition-colors';
                tr.innerHTML = `
                    <td class="p-3 border-r-2 border-black border-dashed font-mono text-sm">${p.barcode}</td>
                    <td class="p-3 border-r-2 border-black border-dashed">${p.name}</td>
                    <td class="p-3 border-r-2 border-black border-dashed text-right font-mono">${p.price.toFixed(2)}</td>
                    <td class="p-3 text-center">
                        <button onclick="openProductModal(${index})" class="pixel-btn bg-[#A2D2FF] px-2 py-1 mr-2 text-xs" title="แก้ไข">EDIT</button>
                        <button onclick="confirmDelete(${index})" class="pixel-btn bg-[#FFC8DD] px-2 py-1 text-xs" title="ลบ">DEL</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            renderQuickItems();
        }

        function openProductModal(index = -1) {
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('product-form');
            
            if (index === -1) {
                title.textContent = 'เพิ่มไอเทมใหม่';
                form.reset();
                document.getElementById('edit-index').value = -1;
            } else {
                title.textContent = 'แก้ไขไอเทม';
                const p = products[index];
                document.getElementById('prod-barcode').value = p.barcode;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('edit-index').value = index;
            }
            modal.classList.remove('hidden');
            setTimeout(() => document.getElementById('prod-barcode').focus(), 100);
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function saveProduct(e) {
            e.preventDefault();
            const barcode = document.getElementById('prod-barcode').value.trim();
            const name = document.getElementById('prod-name').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const editIndex = parseInt(document.getElementById('edit-index').value);
            
            const isDuplicate = products.some((p, idx) => p.barcode === barcode && idx !== editIndex);
            if (isDuplicate) {
                showToast('รหัสนี้มีในระบบแล้ว!', 'error');
                return;
            }
            
            if (editIndex === -1) {
                products.push({ barcode, name, price });
                showToast('บันทึกไอเทมใหม่แล้ว!');
            } else {
                products[editIndex] = { barcode, name, price };
                showToast('อัปเดตไอเทมสำเร็จ!');
                cart.forEach(item => {
                    if(item.barcode === barcode) { item.name = name; item.price = price; }
                });
                updateCartDisplay();
            }
            saveProductsToStorage();
            renderInventory();
            closeProductModal();
        }

        // Custom Confirm Logic
        let confirmAction = null;
        function confirmDelete(index) {
            const p = products[index];
            document.getElementById('confirm-message').textContent = `ทิ้ง "${p.name}" ใช่ไหม?`;
            confirmAction = function() {
                products.splice(index, 1);
                saveProductsToStorage();
                renderInventory();
                showToast('ลบไอเทมเรียบร้อย');
                closeConfirmModal();
            };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        document.getElementById('btn-confirm-yes').onclick = () => {
            if(confirmAction) confirmAction();
        };

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmAction = null;
        }

        function generateRandomBarcode() {
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('prod-barcode').value = `B${randomNum}`;
        }

        function playErrorSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'square'; // เสียง 8-bit
                oscillator.frequency.value = 100; // เสียงต่ำตื๊ดๆ
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio not supported");
            }
        }
    </script>
</body>
</html>
