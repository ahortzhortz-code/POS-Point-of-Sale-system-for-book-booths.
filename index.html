<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิดเงิน - บูธหนังสือ & สินค้าทำมือ</title>
    <!-- นำเข้า Tailwind CSS สำหรับจัดการสไตล์แบบรวดเร็วและสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้าฟอนต์และไอคอน -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- กำหนดสไตล์พื้นฐาน เช่น ฟอนต์และการซ่อนแท็บ -->
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f3f4f6;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* ซ่อนลูกศรใน input type="number" */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800">

    <!-- แถบนำทาง (Navbar) ด้านบน -->
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center z-10">
        <div class="flex items-center group cursor-pointer" onclick="openBoothNameModal()" title="คลิกเพื่อเปลี่ยนชื่อบูธ">
            <h1 class="text-2xl font-semibold flex items-center">
                <i class="fas fa-store mr-2"></i> 
                <span id="display-booth-name">POS บูธหนังสือทำมือ</span>
                <i class="fas fa-edit ml-2 text-indigo-300 opacity-0 group-hover:opacity-100 transition-opacity text-base"></i>
            </h1>
        </div>
        <div class="flex space-x-2">
            <!-- ปุ่มสลับหน้าจอระหว่าง "ขายสินค้า" และ "จัดการสินค้า" -->
            <button onclick="switchTab('checkout')" id="btn-checkout" class="px-4 py-2 bg-indigo-700 hover:bg-indigo-800 rounded font-medium transition active-tab">
                <i class="fas fa-cash-register mr-1"></i> หน้าคิดเงิน
            </button>
            <button onclick="switchTab('inventory')" id="btn-inventory" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-700 rounded font-medium transition">
                <i class="fas fa-boxes mr-1"></i> จัดการสินค้า
            </button>
        </div>
    </header>

    <!-- พื้นที่แสดงเนื้อหาหลัก -->
    <main class="flex-grow overflow-hidden flex flex-col">

        <!-- แท็บคิดเงิน (Checkout) -->
        <div id="tab-checkout" class="tab-content active h-full flex flex-col md:flex-row p-4 gap-4">
            
            <!-- ด้านซ้าย: รายการสินค้าที่เลือก (Cart) -->
            <div class="w-full md:w-2/3 bg-white rounded-lg shadow-md flex flex-col">
                <div class="p-4 border-b bg-gray-50 rounded-t-lg flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-700">รายการสั่งซื้อ</h2>
                    <button onclick="clearCart()" class="text-red-500 hover:text-red-700 text-sm font-medium">
                        <i class="fas fa-trash-alt mr-1"></i> ล้างรายการ
                    </button>
                </div>
                
                <!-- ตารางแสดงสินค้าในตะกร้า -->
                <div class="flex-grow overflow-y-auto p-4">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-500 border-b">
                                <th class="pb-2 font-medium w-1/2">สินค้า</th>
                                <th class="pb-2 font-medium text-center w-1/6">ราคา</th>
                                <th class="pb-2 font-medium text-center w-1/6">จำนวน</th>
                                <th class="pb-2 font-medium text-right w-1/6">รวม</th>
                                <th class="pb-2 w-8"></th>
                            </tr>
                        </thead>
                        <tbody id="cart-items" class="divide-y divide-gray-100">
                            <!-- รายการสินค้าจะถูกเพิ่มที่นี่ด้วย JavaScript -->
                            <tr><td colspan="5" class="py-8 text-center text-gray-400">ยังไม่มีสินค้าในรายการ</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- ส่วนช่องกรอกบาร์โค้ด และ สรุปยอดด้านล่าง -->
                <div class="p-4 border-t bg-gray-50 rounded-b-lg">
                    <div class="flex items-center gap-3 mb-4">
                        <i class="fas fa-barcode text-gray-500 text-2xl"></i>
                        <form id="barcode-form" class="flex-grow flex gap-2" onsubmit="handleBarcodeSubmit(event)">
                            <input type="text" id="barcode-input" placeholder="สแกนบาร์โค้ด หรือ พิมพ์รหัสสินค้าแล้วกด Enter" 
                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg" autofocus autocomplete="off">
                            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">เพิ่ม</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ด้านขวา: ส่วนชำระเงิน และ ปุ่มสินค้าด่วน -->
            <div class="w-full md:w-1/3 flex flex-col gap-4">
                
                <!-- กล่องสรุปยอดเงิน (ยอดรวม) -->
                <div class="bg-indigo-600 text-white rounded-lg shadow-md p-6 text-center">
                    <h3 class="text-indigo-200 text-sm font-medium mb-1">ยอดรวมทั้งสิ้น (บาท)</h3>
                    <div id="cart-total" class="text-5xl font-bold tracking-tight">0.00</div>
                </div>

                <!-- กล่องคำนวณเงินทอน -->
                <div class="bg-white rounded-lg shadow-md p-4 flex-grow flex flex-col">
                    <h3 class="text-lg font-semibold text-gray-700 border-b pb-2 mb-4">รับชำระเงิน</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm text-gray-600 mb-1">รับเงินมา (บาท)</label>
                        <div class="relative">
                            <input type="number" id="cash-received" placeholder="0" oninput="calculateChange()"
                                class="w-full px-4 py-3 text-2xl text-right font-bold border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-green-50 text-green-800">
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-end mb-6">
                        <span class="text-gray-600 text-lg">เงินทอน:</span>
                        <span id="change-amount" class="text-3xl font-bold text-red-500">0.00</span>
                    </div>

                    <!-- ปุ่มชำระเงินด่วน -->
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <button onclick="addCash(20)" class="py-2 border border-green-500 text-green-600 rounded hover:bg-green-50">+20</button>
                        <button onclick="addCash(50)" class="py-2 border border-green-500 text-green-600 rounded hover:bg-green-50">+50</button>
                        <button onclick="addCash(100)" class="py-2 border border-green-500 text-green-600 rounded hover:bg-green-50">+100</button>
                        <button onclick="addCash(500)" class="py-2 border border-green-500 text-green-600 rounded hover:bg-green-50">+500</button>
                        <button onclick="addCash(1000)" class="py-2 border border-green-500 text-green-600 rounded hover:bg-green-50">+1000</button>
                        <button onclick="exactCash()" class="py-2 bg-green-100 text-green-800 rounded font-medium hover:bg-green-200">พอดี</button>
                    </div>

                    <button onclick="completeTransaction()" class="w-full py-4 mt-auto bg-green-500 hover:bg-green-600 text-white rounded-lg font-bold text-xl transition shadow-lg flex justify-center items-center">
                        <i class="fas fa-check-circle mr-2"></i> ทำรายการเสร็จสิ้น
                    </button>
                </div>
                
            </div>
            
            <!-- แผงปุ่มสินค้าลัด (Quick Add Buttons) สำหรับกดเลือกโดยไม่ต้องสแกน -->
            <div id="quick-items-panel" class="absolute bottom-0 left-0 w-full md:w-2/3 h-48 bg-white border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 flex flex-col z-0 transition-transform duration-300 transform translate-y-full">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-semibold text-gray-500">แตะเพื่อเพิ่มสินค้า</h3>
                    <button onclick="toggleQuickPanel()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="quick-items-container" class="flex-grow overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                    <!-- ปุ่มสินค้าด่วนจะแสดงที่นี่ -->
                </div>
            </div>
            <!-- ปุ่มเปิดแผงสินค้าด่วน -->
            <button onclick="toggleQuickPanel()" class="absolute bottom-4 left-4 md:left-[calc(33.33%-1rem)] bg-indigo-600 text-white p-3 rounded-full shadow-lg hover:bg-indigo-700 z-10 flex items-center gap-2">
                <i class="fas fa-th"></i> <span class="hidden sm:inline text-sm">รายการสินค้า</span>
            </button>
        </div>

        <!-- แท็บจัดการสินค้า (Inventory) -->
        <div id="tab-inventory" class="tab-content h-full p-4 overflow-y-auto">
            <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-semibold text-gray-800"><i class="fas fa-boxes text-indigo-500 mr-2"></i> ฐานข้อมูลสินค้า</h2>
                    <button onclick="openProductModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded shadow transition flex items-center">
                        <i class="fas fa-plus mr-2"></i> เพิ่มสินค้าใหม่
                    </button>
                </div>

                <!-- ตารางแสดงสินค้าทั้งหมด -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider">
                                <th class="p-3 border-b">บาร์โค้ด / รหัส</th>
                                <th class="p-3 border-b">ชื่อสินค้า</th>
                                <th class="p-3 border-b text-right">ราคา (บาท)</th>
                                <th class="p-3 border-b text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list" class="divide-y divide-gray-200">
                            <!-- รายการสินค้าจะแสดงที่นี่ -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal (หน้าต่างป็อปอัป) สำหรับเพิ่มหรือแก้ไขสินค้า -->
    <div id="product-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-semibold">เพิ่มสินค้าใหม่</h3>
                <button onclick="closeProductModal()" class="text-indigo-200 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <form id="product-form" class="p-6" onsubmit="saveProduct(event)">
                <input type="hidden" id="edit-index" value="-1">
                
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="prod-barcode">
                        บาร์โค้ด / รหัสสินค้า *
                    </label>
                    <div class="flex">
                        <input type="text" id="prod-barcode" required
                            class="flex-grow shadow appearance-none border rounded-l w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            placeholder="เช่น 885123456789 หรือ B001">
                        <button type="button" onclick="generateRandomBarcode()" class="bg-gray-200 hover:bg-gray-300 px-3 border border-l-0 rounded-r text-gray-600 text-sm">
                            สุ่มรหัส
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">ใช้เครื่องสแกนยิงใส่ช่องนี้ได้เลย</p>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="prod-name">
                        ชื่อสินค้า *
                    </label>
                    <input type="text" id="prod-name" required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        placeholder="เช่น หนังสือทำมือ เล่ม 1">
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="prod-price">
                        ราคา (บาท) *
                    </label>
                    <input type="number" id="prod-price" required min="0" step="0.25"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        placeholder="0.00">
                </div>
                
                <div class="flex items-center justify-end gap-2">
                    <button type="button" onclick="closeProductModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        ยกเลิก
                    </button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline">
                        บันทึก
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal สำหรับเปลี่ยนชื่อบูธ -->
    <div id="booth-name-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="text-lg font-semibold">ตั้งค่าชื่อบูธ</h3>
                <button onclick="closeBoothNameModal()" class="text-indigo-200 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form class="p-6" onsubmit="saveBoothName(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="input-booth-name">
                        ชื่อบูธของคุณ
                    </label>
                    <input type="text" id="input-booth-name" required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        placeholder="เช่น บูธหนังสือทำมือ A01">
                </div>
                <div class="flex items-center justify-end gap-2">
                    <button type="button" onclick="closeBoothNameModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        ยกเลิก
                    </button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline">
                        บันทึก
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- แจ้งเตือนแบบ Toast -->
    <div id="toast" class="fixed top-4 right-4 bg-gray-800 text-white px-6 py-3 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        <span id="toast-message">ข้อความ</span>
    </div>

    <script>
        // --- 1. ข้อมูลและสถานะของแอป (State) ---
        
        let boothName = 'POS บูธหนังสือทำมือ';

        // ข้อมูลสินค้า (สมมติให้มีข้อมูลตั้งต้นเพื่อแสดงตัวอย่าง)
        let products = [
            { barcode: '1001', name: 'หนังสือ นิทานทำมือ', price: 150 },
            { barcode: '1002', name: 'สมุดบันทึก ปกหนัง', price: 89 },
            { barcode: '1003', name: 'โปสการ์ด ภาพวาดสีน้ำ', price: 20 },
            { barcode: '1004', name: 'ที่คั่นหนังสือ ลายดอกไม้', price: 15 },
            { barcode: '885000000001', name: 'กระเป๋าผ้าสกรีนลาย', price: 199 }
        ];

        // ตะกร้าสินค้า
        // รูปแบบ: { barcode: '1001', name: '...', price: 150, qty: 1 }
        let cart = [];

        // ฟังก์ชันเริ่มต้นทำงานเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            // โหลดข้อมูลชื่อบูธ
            const savedBoothName = localStorage.getItem('pos_booth_name');
            if (savedBoothName) {
                boothName = savedBoothName;
                document.getElementById('display-booth-name').textContent = boothName;
            }

            // โหลดข้อมูลสินค้าจาก LocalStorage (ถ้ามี)
            const savedProducts = localStorage.getItem('pos_products');
            if (savedProducts) {
                products = JSON.parse(savedProducts);
            }

            renderInventory();
            renderQuickItems();
            updateCartDisplay();
            
            // ให้ช่องสแกนพร้อมรับข้อมูลเสมอในหน้าคิดเงิน
            document.getElementById('barcode-input').focus();
        };

        // บันทึกข้อมูลสินค้าลง LocalStorage
        function saveProductsToStorage() {
            localStorage.setItem('pos_products', JSON.stringify(products));
        }

        // --- 2. การควบคุม UI หลัก ---

        // สลับหน้า (Tab)
        function switchTab(tabName) {
            // ซ่อนทุกหน้า
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // แสดงหน้าที่เลือก
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // เปลี่ยนสีปุ่มเมนู
            document.getElementById('btn-checkout').classList.replace('bg-indigo-700', 'bg-indigo-500');
            document.getElementById('btn-inventory').classList.replace('bg-indigo-700', 'bg-indigo-500');
            document.getElementById(`btn-${tabName}`).classList.replace('bg-indigo-500', 'bg-indigo-700');

            // ถ้ากลับมาหน้าคิดเงิน ให้โฟกัสที่ช่องสแกน
            if(tabName === 'checkout') {
                setTimeout(() => document.getElementById('barcode-input').focus(), 100);
            }
        }

        // แสดงแจ้งเตือนมุมจอ
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            
            if(type === 'error') {
                toast.classList.replace('bg-gray-800', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-800');
            }

            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        // --- ระบบจัดการชื่อบูธ ---
        function openBoothNameModal() {
            document.getElementById('input-booth-name').value = boothName;
            document.getElementById('booth-name-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-booth-name').focus(), 100);
        }

        function closeBoothNameModal() {
            document.getElementById('booth-name-modal').classList.add('hidden');
            // นำโฟกัสกลับไปที่ช่องสแกนบาร์โค้ดหากอยู่ในหน้าคิดเงิน
            if (document.getElementById('tab-checkout').classList.contains('active')) {
                document.getElementById('barcode-input').focus();
            }
        }

        function saveBoothName(e) {
            e.preventDefault();
            const newName = document.getElementById('input-booth-name').value.trim();
            if (newName) {
                boothName = newName;
                document.getElementById('display-booth-name').textContent = boothName;
                localStorage.setItem('pos_booth_name', boothName);
                closeBoothNameModal();
                showToast('เปลี่ยนชื่อบูธเรียบร้อย');
            }
        }

        // --- 3. ระบบคิดเงิน (Checkout) ---

        // จัดการเมื่อมีการ Submit ช่องกรอกบาร์โค้ด (กด Enter จากคีย์บอร์ดหรือเครื่องสแกน)
        function handleBarcodeSubmit(e) {
            e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช
            const input = document.getElementById('barcode-input');
            const barcode = input.value.trim();
            
            if (barcode === '') return;

            addItemToCart(barcode);
            
            // ล้างช่องกรอกเพื่อรอรับอันต่อไป
            input.value = '';
            input.focus();
        }

        // เพิ่มสินค้าลงตะกร้าด้วยบาร์โค้ด
        function addItemToCart(barcode) {
            // ค้นหาสินค้าจากฐานข้อมูล
            const product = products.find(p => p.barcode === barcode);
            
            if (product) {
                // ตรวจสอบว่ามีสินค้านี้ในตะกร้าแล้วหรือยัง
                const existingItemIndex = cart.findIndex(item => item.barcode === barcode);
                
                if (existingItemIndex >= 0) {
                    // ถ้ามีแล้ว เพิ่มจำนวน
                    cart[existingItemIndex].qty += 1;
                } else {
                    // ถ้ายังไม่มี เพิ่มใหม่
                    cart.push({
                        barcode: product.barcode,
                        name: product.name,
                        price: product.price,
                        qty: 1
                    });
                }
                
                // อัพเดทหน้าจอ
                updateCartDisplay();
                // แสดงผลสั้นๆ ว่าเพิ่มสำเร็จ
                showToast(`เพิ่ม ${product.name} แล้ว`);
            } else {
                // ไม่พบสินค้า
                showToast(`ไม่พบสินค้าบาร์โค้ด: ${barcode}`, 'error');
                // เล่นเสียงเตือนสั้นๆ (Beep) ผ่าน Web Audio API ง่ายๆ
                playErrorBeep();
            }
        }

        // เปลี่ยนจำนวนสินค้าในตะกร้า
        function updateCartItemQty(index, change) {
            cart[index].qty += change;
            
            // ถ้าจำนวนน้อยกว่า 1 ให้ลบออก
            if (cart[index].qty < 1) {
                cart.splice(index, 1);
            }
            
            updateCartDisplay();
        }

        // ลบสินค้าออกจากตะกร้า
        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        // ล้างตะกร้าทั้งหมด
        function clearCart() {
            if (cart.length === 0) return;
            cart = [];
            document.getElementById('cash-received').value = '';
            updateCartDisplay();
        }

        // อัพเดทการแสดงผลตารางตะกร้าและยอดรวม
        function updateCartDisplay() {
            const tbody = document.getElementById('cart-items');
            tbody.innerHTML = '';
            
            let total = 0;

            if (cart.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-gray-400">ยังไม่มีสินค้าในรายการ</td></tr>';
            } else {
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.qty;
                    total += itemTotal;
                    
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="py-3 font-medium text-gray-800">
                            ${item.name}
                            <div class="text-xs text-gray-400">${item.barcode}</div>
                        </td>
                        <td class="py-3 text-center text-gray-600">${item.price.toFixed(2)}</td>
                        <td class="py-3 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="updateCartItemQty(${index}, -1)" class="w-6 h-6 bg-gray-200 rounded-full flex items-center justify-center hover:bg-gray-300">-</button>
                                <span class="w-6 text-center">${item.qty}</span>
                                <button onclick="updateCartItemQty(${index}, 1)" class="w-6 h-6 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center hover:bg-indigo-200">+</button>
                            </div>
                        </td>
                        <td class="py-3 text-right font-medium text-gray-800">${itemTotal.toFixed(2)}</td>
                        <td class="py-3 text-right">
                            <button onclick="removeCartItem(${index})" class="text-red-400 hover:text-red-600">
                                <i class="fas fa-times"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // อัพเดทยอดรวม
            document.getElementById('cart-total').textContent = total.toFixed(2);
            
            // คำนวณเงินทอนใหม่
            calculateChange();
            
            // เอาโฟกัสกลับไปที่ช่องแสกน
            document.getElementById('barcode-input').focus();
        }

        // --- 4. การรับเงินและเงินทอน ---

        function calculateChange() {
            const totalText = document.getElementById('cart-total').textContent;
            const total = parseFloat(totalText);
            
            const cashInput = document.getElementById('cash-received').value;
            const cash = parseFloat(cashInput) || 0;
            
            const changeDisplay = document.getElementById('change-amount');
            
            if (cash >= total && total > 0) {
                const change = cash - total;
                changeDisplay.textContent = change.toFixed(2);
                changeDisplay.classList.replace('text-gray-400', 'text-red-500');
            } else {
                changeDisplay.textContent = '0.00';
                changeDisplay.classList.replace('text-red-500', 'text-gray-400');
            }
        }

        // ปุ่มเพิ่มเงินด่วน (เช่น รับแบงก์ 100)
        function addCash(amount) {
            const input = document.getElementById('cash-received');
            const currentVal = parseFloat(input.value) || 0;
            input.value = currentVal + amount;
            calculateChange();
        }

        // ปุ่มรับเงินพอดี
        function exactCash() {
            const total = document.getElementById('cart-total').textContent;
            document.getElementById('cash-received').value = total;
            calculateChange();
        }

        // ทำรายการสำเร็จ
        function completeTransaction() {
            const total = parseFloat(document.getElementById('cart-total').textContent);
            const cash = parseFloat(document.getElementById('cash-received').value) || 0;

            if (cart.length === 0) {
                showToast('ไม่มีสินค้าในรายการ', 'error');
                return;
            }

            if (cash < total) {
                showToast('ยอดเงินรับมาไม่พอ', 'error');
                return;
            }

            const change = cash - total;
            
            // ในระบบจริง จะส่งข้อมูลไปบันทึกบน Server ตรงนี้
            // สำหรับแอปนี้ เราจะจำลองการทำงานสำเร็จ

            // แสดง Popup ยืนยันสั้นๆ
            alert(`ทำรายการสำเร็จ!\n\nยอดรวม: ${total.toFixed(2)} บาท\nรับเงิน: ${cash.toFixed(2)} บาท\nเงินทอน: ${change.toFixed(2)} บาท`);
            
            // ล้างข้อมูลเพื่อเริ่มบิลใหม่
            clearCart();
        }

        // --- 5. แผงสินค้าด่วน (Quick Panel) ---
        
        let quickPanelOpen = false;
        function toggleQuickPanel() {
            const panel = document.getElementById('quick-items-panel');
            quickPanelOpen = !quickPanelOpen;
            
            if (quickPanelOpen) {
                panel.classList.remove('translate-y-full');
            } else {
                panel.classList.add('translate-y-full');
                document.getElementById('barcode-input').focus();
            }
        }

        // วาดปุ่มสินค้าลงใน Quick Panel
        function renderQuickItems() {
            const container = document.getElementById('quick-items-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border hover:border-indigo-500 hover:bg-indigo-50 rounded-lg p-2 flex flex-col justify-between text-left h-24 transition';
                btn.onclick = () => {
                    addItemToCart(p.barcode);
                    // ถ้าต้องการให้กดแล้วปิดแผงเลย ให้เปิดคอมเมนต์บรรทัดล่าง
                    // toggleQuickPanel(); 
                };
                
                // ทำสีสุ่มบางๆ สำหรับพื้นหลังไอคอน
                const colors = ['bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-yellow-100 text-yellow-600', 'bg-pink-100 text-pink-600'];
                const colorClass = colors[p.name.length % colors.length];

                btn.innerHTML = `
                    <div class="flex items-start justify-between w-full">
                        <div class="w-8 h-8 rounded-full ${colorClass} flex items-center justify-center text-xs flex-shrink-0">
                            <i class="fas fa-box"></i>
                        </div>
                        <span class="font-bold text-indigo-700">฿${p.price}</span>
                    </div>
                    <div class="text-sm text-gray-700 font-medium leading-tight line-clamp-2 mt-1 w-full truncate text-wrap">
                        ${p.name}
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        // --- 6. ระบบจัดการสินค้า (Inventory) ---

        // วาดตารางสินค้าในหน้า จัดการสินค้า
        function renderInventory() {
            const tbody = document.getElementById('inventory-list');
            tbody.innerHTML = '';
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">ไม่มีข้อมูลสินค้า กดปุ่มเพิ่มสินค้าใหม่</td></tr>';
                return;
            }
            
            products.forEach((p, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3 border-b font-mono text-sm text-gray-600">${p.barcode}</td>
                    <td class="p-3 border-b font-medium">${p.name}</td>
                    <td class="p-3 border-b text-right">${p.price.toFixed(2)}</td>
                    <td class="p-3 border-b text-center">
                        <button onclick="editProduct(${index})" class="text-blue-500 hover:text-blue-700 mr-2" title="แก้ไข">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteProduct(${index})" class="text-red-500 hover:text-red-700" title="ลบ">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            // อัพเดทแผงสินค้าด่วนด้วยเผื่อมีสินค้าใหม่
            renderQuickItems();
        }

        // เปิด Modal จัดการสินค้า (เพิ่ม/แก้ไข)
        function openProductModal(index = -1) {
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('product-form');
            const inputIndex = document.getElementById('edit-index');
            
            if (index === -1) {
                // โหมดเพิ่มสินค้าใหม่
                title.textContent = 'เพิ่มสินค้าใหม่';
                form.reset();
                inputIndex.value = -1;
            } else {
                // โหมดแก้ไขสินค้า
                title.textContent = 'แก้ไขสินค้า';
                const p = products[index];
                document.getElementById('prod-barcode').value = p.barcode;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-price').value = p.price;
                inputIndex.value = index;
            }
            
            modal.classList.remove('hidden');
            document.getElementById('prod-barcode').focus();
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        // บันทึกสินค้า (จาก Modal)
        function saveProduct(e) {
            e.preventDefault();
            
            const barcode = document.getElementById('prod-barcode').value.trim();
            const name = document.getElementById('prod-name').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const editIndex = parseInt(document.getElementById('edit-index').value);
            
            // ตรวจสอบบาร์โค้ดซ้ำ (ในกรณีเพิ่มใหม่ หรือแก้ไขแต่เปลี่ยนบาร์โค้ด)
            const isDuplicate = products.some((p, idx) => p.barcode === barcode && idx !== editIndex);
            if (isDuplicate) {
                showToast('บาร์โค้ดนี้มีอยู่ในระบบแล้ว', 'error');
                return;
            }
            
            const productData = { barcode, name, price };
            
            if (editIndex === -1) {
                // เพิ่มใหม่
                products.push(productData);
                showToast('เพิ่มสินค้าสำเร็จ');
            } else {
                // อัพเดทของเดิม
                products[editIndex] = productData;
                showToast('อัพเดทสินค้าสำเร็จ');
                
                // อัพเดทข้อมูลในตะกร้าด้วยถ้าสินค้านั้นถูกเลือกอยู่
                cart.forEach(item => {
                    if(item.barcode === barcode) {
                        item.name = name;
                        item.price = price;
                    }
                });
                updateCartDisplay();
            }
            
            saveProductsToStorage();
            renderInventory();
            closeProductModal();
        }

        // ลบสินค้า
        function deleteProduct(index) {
            const p = products[index];
            if(confirm(`คุณแน่ใจหรือไม่ที่จะลบสินค้า "${p.name}" ?`)) {
                products.splice(index, 1);
                saveProductsToStorage();
                renderInventory();
                showToast('ลบสินค้าแล้ว');
            }
        }

        // สร้างบาร์โค้ดแบบสุ่ม (กรณีสินค้าไม่มีบาร์โค้ด)
        function generateRandomBarcode() {
            // สร้างรหัส B ตามด้วยตัวเลข 4 หลัก
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('prod-barcode').value = `B${randomNum}`;
        }

        // Helper: เสียงเตือนเมื่อหาสินค้าไม่พบ
        function playErrorBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.value = 150; // เสียงต่ำๆ ตื๊ดๆ
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2); // เสียงดัง 0.2 วิ
            } catch (e) {
                // ถ้า Browser ไม่รองรับ ก็ไม่เป็นไร
                console.log("Audio not supported");
            }
        }
    </script>
